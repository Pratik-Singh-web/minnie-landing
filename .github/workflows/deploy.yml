name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # Astro 7.4 needs Node >=22.23.4, and the runner's newest 22.x can
          # lag behind that (it was 22.23.3 on 25 Oct 2026, failing the build).
          # 24 is the current LTS and clears the floor.
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action's default 10-minute wait is not always enough: the Pages
          # deployment queue can sit on `deployment_queued` for longer, and when
          # the action gives up it cancels the deployment. A cancelled SHA can
          # never be redeployed — retries on the same commit are rejected
          # instantly — so a premature timeout costs you an empty commit to
          # retry. 25 minutes of patience is cheaper.
          timeout: 1500000
