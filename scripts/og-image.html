<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Karla:wght@400;500&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  /* Brand tokens, copied from src/styles/global.css (light theme). */
  :root {
    --paper: #f4efe2;
    --ink: #101a12;
    --ink-dim: #4a5b4e;
    --green-deep: #0f3d24;
    --yellow: #ffd23f;
    --pink: #ff5f9e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper);
    font-family: Karla, system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 0 60px;
    overflow: hidden;
  }

  /* ---- left column ---------------------------------------------------- */
  .left { width: 600px; flex: none; }

  .eyebrow {
    display: inline-block;
    background: var(--yellow);
    border: 4px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    padding: 10px 18px;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  h1 {
    font-family: Outfit, sans-serif;
    font-weight: 900;
    font-size: 80px;
    line-height: 0.92;
    letter-spacing: -0.03em;
    text-transform: uppercase;
  }
  .slab {
    display: inline-block;
    background: var(--pink);
    border: 4px solid var(--ink);
    box-shadow: 9px 9px 0 var(--ink);
    padding: 4px 20px 10px;
    transform: rotate(-1.4deg);
    margin-top: 14px;
  }

  .sub {
    margin-top: 30px;
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink-dim);
    max-width: 505px;
  }

  .badges { display: flex; gap: 14px; margin-top: 32px; }
  .badge {
    background: #fff;
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding: 11px 15px;
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge--green { background: var(--green-deep); color: var(--paper); }

  /* ---- right: the app icon, as the mark ------------------------------- */
  .mark { position: relative; flex: none; margin-left: auto; }
  .icon {
    position: relative;
    width: 340px;
    height: 340px;
    border: 5px solid var(--ink);
    border-radius: 23%;
    box-shadow: 13px 13px 0 var(--ink);
    transform: rotate(-2deg);
    /* Overscan slightly so the icon's own transparent rounded corners sit
       under the border instead of showing a sliver of background. */
    background-image: url("../public/icon-512x512.png");
    background-size: 104% 104%;
    background-position: center;
    background-repeat: no-repeat;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="eyebrow">■ macOS · your agent, now with legs</div>
    <h1>Give your<br />AI agent<br /><span class="slab">a body.</span></h1>
    <p class="sub">
      A desktop creature that runs the coding agent you already pay for — and
      asks out loud before she touches a file.
    </p>
    <div class="badges">
      <div class="badge badge--green">Zero extra AI cost</div>
      <div class="badge">Runs on your Mac</div>
      <div class="badge">On-device voice</div>
    </div>
  </div>
  <div class="mark"><div class="icon"></div></div>
</body>
</html>
