<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet" />
<style>
  /* Brand tokens and type, copied from src/styles/global.css (light theme) and
     src/sections/Hero.astro — the card is the hero, at 1200x630. Re-sync both
     when either changes, then run scripts/build-og-image.sh. */
  :root {
    --paper: #fffcf7;
    --sunk: #fff1de;
    --line: #f0e0d0;
    --ink: #2e1b12;
    --ink-dim: #6b4a3a;
    --accent-ink: #b8390f;
    --accent-t: #ffeacd;
    --green: #1fb88a;
    --band: #2e1b12;
    --on-band: #fffcf7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 0 60px;
    overflow: hidden;
  }

  /* ---- left column ---------------------------------------------------- */
  .left { width: 660px; flex: none; }

  /* The hero's .hero__free pill (src/sections/Hero.astro). */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
    padding: 9px 18px;
    border-radius: 999px;
    background: var(--accent-t);
    color: var(--accent-ink);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 99px;
    background: var(--green);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 25%, transparent);
  }

  /* The hero's .h1 (src/styles/global.css): one grotesque, heavy, tracked tight. */
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 76px;
    line-height: 1.02;
    letter-spacing: -0.065em;
    white-space: nowrap;
  }
  .slab {
    display: inline-block;
    color: var(--accent-ink);
  }

  /* The hero's .hero__lede. */
  .sub {
    margin-top: 28px;
    font-size: 23px;
    line-height: 1.5;
    color: var(--ink-dim);
    max-width: 540px;
  }

  .badges { display: flex; gap: 14px; margin-top: 32px; }
  .badge {
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .badge--green { background: var(--band); border-color: var(--band); color: var(--on-band); }

  /* ---- right: the app icon, as the mark ------------------------------- */
  .mark { position: relative; flex: none; margin-left: auto; }
  .icon {
    position: relative;
    width: 340px;
    height: 340px;
    border-radius: 23%;
    /* Overscan slightly so the icon's own transparent rounded corners sit
       under the border instead of showing a sliver of background. */
    background-image: url("../public/icon-512x512.png");
    background-size: 104% 104%;
    background-position: center;
    background-repeat: no-repeat;
  }
</style>
</head>
<body>
  <div class="left">
    <div class="eyebrow"><span class="dot"></span>macOS · your agent, now with legs</div>
    <h1>Give your AI agent<br /><span class="slab">a body.</span></h1>
    <p class="sub">
      A desktop creature that runs the coding agent you already pay for — and
      asks out loud before she touches a file.
    </p>
    <div class="badges">
      <div class="badge badge--green">Zero extra AI cost</div>
      <div class="badge">Runs on your Mac</div>
      <div class="badge">On-device voice</div>
    </div>
  </div>
  <div class="mark"><div class="icon"></div></div>
</body>
</html>
